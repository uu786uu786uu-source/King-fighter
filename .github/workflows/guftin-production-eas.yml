name: Guftin Production EAS Android APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/guftin-production-eas.yml
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or commit to build
        required: true
        default: release/guftin-v1.5.4-otp-channel-admin
        type: string

permissions:
  contents: read

jobs:
  build-production-apk:
    name: Validate and trigger signed EAS production APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Guftin source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || 'release/guftin-v1.5.4-otp-channel-admin' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Verify restored Guftin release source
        working-directory: apps/kingchat
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const appConfig = fs.readFileSync('app.config.js', 'utf8');
          if (pkg.version !== '1.5.6' || !/version:\s*"1\.5\.6"/.test(appConfig) || !/versionCode:\s*42/.test(appConfig)) {
            console.error('Refusing to build: expected the full Guftin 1.5.6 / Android code 42 source.');
            process.exit(1);
          }
          console.log('Verified Guftin 1.5.6 / Android code 42 source.');
          NODE

      - name: Verify Expo owner token is available
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN is missing."
            exit 1
          fi
          echo "Expo access token is present (value hidden)."

      - name: Install app dependencies
        working-directory: apps/kingchat
        run: npm install --no-audit --no-fund

      - name: Verify Expo identity and Guftin project access
        working-directory: apps/kingchat
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest project:info

      - name: TypeScript validation
        working-directory: apps/kingchat
        run: npm run typecheck

      - name: Prepare launcher and splash assets
        working-directory: apps/kingchat
        run: npm run prepare:assets

      - name: Trigger signed EAS production APK build
        working-directory: apps/kingchat
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --no-wait
