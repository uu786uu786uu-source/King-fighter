name: Guftin Production EAS Android APK

on:
  push:
    branches:
      - kingchat/production-demo
    paths:
      - ".github/workflows/guftin-production-eas.yml"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or commit to build
        required: true
        default: kingchat/production-demo
        type: string

permissions:
  contents: read

jobs:
  build-production-apk:
    name: Validate Owner access and trigger signed EAS production APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Guftin source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Verify Organization Owner token is available
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions repository secret EXPO_TOKEN is missing. Add the Owner token for the uu786 organization under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Expo access token is present (value hidden)."

      - name: Install Guftin dependencies
        working-directory: apps/kingchat
        run: npm install --no-audit --no-fund

      - name: Verify Expo identity
        working-directory: apps/kingchat
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest whoami

      - name: Verify linked Guftin EAS project access
        working-directory: apps/kingchat
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest project:info

      - name: TypeScript validation
        working-directory: apps/kingchat
        run: npm run typecheck

      - name: Prepare launcher and splash assets
        working-directory: apps/kingchat
        run: npm run prepare:assets

      - name: Trigger signed EAS production APK build
        working-directory: apps/kingchat
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --no-wait
