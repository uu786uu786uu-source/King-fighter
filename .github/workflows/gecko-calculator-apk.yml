name: Build Gecko Calculator APK

on:
  push:
    paths:
      - 'gecko-calculator/**'
      - '.github/workflows/gecko-calculator-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Gecko Calculator APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        run: |
          test -f gecko-calculator/settings.gradle
          test -f gecko-calculator/build.gradle
          test -f gecko-calculator/app/build.gradle
          test -f gecko-calculator/app/src/main/AndroidManifest.xml
          test -f gecko-calculator/app/src/main/java/com/gecko/calculator/MainActivity.kt

      - name: Build debug APK
        working-directory: gecko-calculator
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          ls -lh gecko-calculator/app/build/outputs/apk/debug/
          test -s gecko-calculator/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gecko-Calculator-debug-APK
          path: gecko-calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
