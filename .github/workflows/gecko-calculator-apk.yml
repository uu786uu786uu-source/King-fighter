name: Build Gecko Calculator APK

on:
  push:
    paths:
      - 'gecko-calculator/**'
      - '.github/workflows/gecko-calculator-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: gecko-calculator
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -f gecko-calculator/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gecko-Calculator-debug-APK
          path: gecko-calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
