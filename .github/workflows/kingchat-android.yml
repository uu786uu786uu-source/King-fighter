name: Build King Chat Android APK

concurrency:
  group: kingchat-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - kingchat/production-demo
    paths:
      - "apps/kingchat/**"
      - ".github/workflows/kingchat-android.yml"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kingchat
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check push project configuration
        env:
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID || '814cd723-8bea-4288-84b5-d489fdb37269' }}
        run: |
          if [ -z "$EXPO_PUBLIC_EAS_PROJECT_ID" ]; then
            echo "::warning:: EXPO_PUBLIC_EAS_PROJECT_ID is empty. The app can request notification permission, but push-token registration and background push cannot work until the Expo project is linked and FCM V1 credentials are configured."
          else
            echo "Expo EAS project ID is configured for push-token registration."
          fi
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate Guftin launcher and splash assets
        run: npm run prepare:assets
      - name: Verify Android JavaScript bundle
        env:
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID || '814cd723-8bea-4288-84b5-d489fdb37269' }}
        run: npx expo export --platform android --output-dir .expo-smoke-export
      - name: Generate native Android project
        env:
          CI: 1
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID || '814cd723-8bea-4288-84b5-d489fdb37269' }}
        run: npx expo prebuild --platform android
      - name: Verify Android architecture and CallKeep dependency
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'newArchEnabled=false' android/gradle.properties
          node -e 'const p=require("react-native-callkeep/package.json"); console.log("CallKeep version:", p.version); if (p.version !== "4.6.1") process.exit(1);'
          CALLKEEP_SOURCE="node_modules/react-native-callkeep/android/src/main/java/io/wazo/callkeep/RNCallKeepModule.java"
          test -s "$CALLKEEP_SOURCE"
          echo "Android legacy bridge is explicitly selected; CallKeep native source is present."
      - name: Verify LiveKit Android startup initialization
        shell: bash
        run: |
          set -euo pipefail
          MAIN_APP="$(find android/app/src/main/java -name MainApplication.kt -print -quit)"
          test -n "$MAIN_APP"
          grep -Fq 'LiveKitReactNative.setup(this, AudioType.CommunicationAudioType())' "$MAIN_APP"
          grep -Fq 'import com.livekit.reactnative.LiveKitReactNative' "$MAIN_APP"
          echo "LiveKit Android native initialization is present before React Native startup."
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        run: |
          cd android
          gradle --no-daemon assembleRelease
      - name: Verify existing Guftin install signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="./android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found; refusing to upload an unverified APK."
            exit 1
          fi
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          ACTUAL_FINGERPRINT="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -nE 's/.*Signer: certificate SHA-256 digest: ([[:xdigit:]:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_FINGERPRINT="fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::APK signing certificate does not match the existing Guftin installation. Expected $EXPECTED_FINGERPRINT but got ${ACTUAL_FINGERPRINT:-none}. APK will not be uploaded."
            exit 1
          fi
          echo "APK signing certificate matches the existing Guftin GitHub build."
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test installed APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: apps/kingchat
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/apps/kingchat/scripts/android-startup-smoke.sh"
      - name: Upload Android startup smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guftin-android-startup-smoke-log
          path: apps/kingchat/startup-smoke-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-chat-android-apk
          path: apps/kingchat/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
