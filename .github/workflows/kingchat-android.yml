name: Build King Chat Android APK

concurrency:
  group: kingchat-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - kingchat/production-demo
    paths:
      - "apps/kingchat/**"
      - ".github/workflows/kingchat-android.yml"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GUFTIN_GOOGLE_WEB_CLIENT_ID || '317953265600-oaddv5sf8ih1mqt0g2vq0ic15a9v7ft7.apps.googleusercontent.com' }}
      EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: ${{ vars.GUFTIN_GOOGLE_IOS_URL_SCHEME }}
    defaults:
      run:
        working-directory: apps/kingchat
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Google OAuth build configuration
        run: |
          if [ -z "${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-}" ]; then
            echo "::error::Google Web OAuth Client ID is missing; refusing to build a broken APK."
            exit 1
          elif [[ "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::GUFTIN_GOOGLE_WEB_CLIENT_ID must be a Google OAuth Web Client ID ending in .apps.googleusercontent.com"
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate Guftin launcher and splash assets
        run: npm run prepare:assets
      - name: Generate native Android project
        env:
          CI: 1
        run: npx expo prebuild --platform android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-chat-android-apk
          path: apps/kingchat/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
