<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54"><title>King Chat</title>
<style>
:root{--green:#075e54;--lime:#25d366;--bg:#efeae2;--ink:#111b21;--muted:#667781}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:white;font-weight:600}.app{height:100dvh;max-width:760px;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 24px #0001}.top{background:var(--green);color:white;padding:16px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:.2px}.tag{font-size:12px;opacity:.8}.tabs{display:flex;background:var(--green);color:#cde5df}.tab{flex:1;text-align:center;padding:12px 4px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:white;border-color:var(--lime)}.search{padding:12px;background:#f6f6f6}.search input,.field{width:100%;padding:12px;border:1px solid #d9e0e3;border-radius:10px;background:white;outline-color:var(--lime)}.content{flex:1;overflow:auto}.row{padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #f0f0f0;cursor:pointer}.avatar{width:48px;height:48px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#d9fdd3;color:var(--green);font-weight:800;font-size:19px}.rowmain{min-width:0;flex:1}.rowtitle{font-weight:650}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.time{font-size:11px;color:var(--muted)}.bottom{padding:10px 14px;border-top:1px solid #eee;display:flex;gap:8px;align-items:center}.bottom input{flex:1;min-width:0;border-radius:22px}.screen{padding:20px}.hidden{display:none!important}.notice{margin:16px;padding:12px;background:#fff4d7;border-radius:10px;font-size:13px;color:#614b12}.auth{max-width:420px;margin:10vh auto;padding:24px}.auth h1{color:var(--green)}.auth .field{margin:7px 0}.bubble{max-width:82%;padding:10px 12px;margin:8px 12px;border-radius:12px;background:#fff;box-shadow:0 1px 1px #0001;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#d9fdd3}.muted{color:var(--muted);font-size:13px}.sectiontitle{padding:16px;font-weight:750}.empty{text-align:center;color:var(--muted);padding:42px 20px}.statusdot{display:inline-block;width:8px;height:8px;background:var(--lime);border-radius:50%;margin-right:5px}
</style>
</head>
<body>
<div id="authView" class="auth">
 <div class="brand" style="color:#075e54">👑 King Chat</div><p class="muted">Private messaging, built for your community.</p>
 <h1>Welcome</h1><input id="email" class="field" type="email" placeholder="Email address" autocomplete="email"><input id="password" class="field" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
 <button id="signIn" style="width:100%;margin-top:8px">Sign in</button><button id="signUp" style="width:100%;margin-top:8px;background:#128c7e">Create account</button><button id="googleIn" style="width:100%;margin-top:8px;background:#fff;color:#333;border:1px solid #ddd">Continue with Google</button>
 <p class="muted">Google sign-in works after you enable it in your Firebase project.</p><p id="authMessage" class="muted"></p>
</div>
<div id="appView" class="app hidden">
 <header class="top"><div><div class="brand">👑 King Chat</div><div class="tag">Simple. Fast. Connected.</div></div><button id="logout" style="background:#ffffff22">Log out</button></header>
 <nav class="tabs"><div class="tab active" data-tab="chats">CHATS</div><div class="tab" data-tab="people">PEOPLE</div><div class="tab" data-tab="updates">UPDATES</div><div class="tab" data-tab="settings">SETTINGS</div></nav>
 <div id="searchWrap" class="search"><input id="search" placeholder="Search conversations or people"></div>
 <main id="main" class="content"></main>
 <div id="composer" class="bottom hidden"><input id="messageInput" class="field" placeholder="Message"><button id="send">Send ➤</button></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, getDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// Replace these placeholders with the Web App config from Firebase Console > Project settings.
const firebaseConfig = {apiKey: "AIzaSyATfe-auJU0CdMyRN0YS7oIhB85dGL8gmU",authDomain:"kingchat-ecbd6.firebaseapp.com",projectId: "kingchat-ecbd6",storageBucket:"kingchat-ecbd6.firebasestorage.app",messagingSenderId:"317953265600",appId: "1:317953265600:web:6977c511217f9dc76e8225"};
const authView=document.querySelector('#authView'),appView=document.querySelector('#appView'),main=document.querySelector('#main'),composer=document.querySelector('#composer'),searchWrap=document.querySelector('#searchWrap');
let app,auth,db,currentUser,activeTab='chats',activeChat=null,unsubMessages=null,unsubChats=null,allUsers=[];
const msg=(s)=>document.querySelector('#authMessage').textContent=s;
try { if(firebaseConfig.apiKey!=="YOUR_API_KEY"){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async u=>{currentUser=u;if(u){authView.classList.add('hidden');appView.classList.remove('hidden');await setDoc(doc(db,'users',u.uid),{uid:u.uid,name:u.displayName||u.email?.split('@')[0]||'King Chat user',email:u.email||'',photoURL:u.photoURL||'',lastSeen:serverTimestamp()},{merge:true});renderTab('chats')}else{appView.classList.add('hidden');authView.classList.remove('hidden');if(unsubChats)unsubChats();if(unsubMessages)unsubMessages()}})}else{msg('Setup required: add your Firebase web config in index.html. See README for steps.')}}catch(e){msg(e.message)}
document.querySelector('#signIn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value,document.querySelector('#password').value);msg('')}catch(e){msg(e.message)}};
document.querySelector('#signUp').onclick=async()=>{try{const c=await createUserWithEmailAndPassword(auth,document.querySelector('#email').value,document.querySelector('#password').value);await updateProfile(c.user,{displayName:c.user.email.split('@')[0]});msg('')}catch(e){msg(e.message)}};
document.querySelector('#googleIn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){msg(e.message)}};
document.querySelector('#logout').onclick=()=>signOut(auth);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>renderTab(t.dataset.tab));
document.querySelector('#search').addEventListener('input',()=>renderTab(activeTab));
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function row(name,preview,click,photo){const r=el('div','row'),a=el('div','avatar',name.slice(0,1).toUpperCase());if(photo){a.textContent='';a.style.backgroundImage='url('+photo+')';a.style.backgroundSize='cover'}const m=el('div','rowmain');m.append(el('div','rowtitle',name),el('div','preview',preview));r.append(a,m);if(click)r.onclick=click;return r}
async function renderTab(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));main.replaceChildren();composer.classList.add('hidden');searchWrap.classList.toggle('hidden',tab==='settings');if(unsubChats){unsubChats();unsubChats=null}if(unsubMessages){unsubMessages();unsubMessages=null}if(!currentUser||!db)return;
const term=document.querySelector('#search').value.trim().toLowerCase();
if(tab==='chats'){main.append(el('div','sectiontitle','Your conversations'));const q=query(collection(db,'chats'),where('members','array-contains',currentUser.uid),orderBy('updatedAt','desc'),limit(50));unsubChats=onSnapshot(q,snap=>{main.replaceChildren(el('div','sectiontitle','Your conversations'));let found=0;snap.forEach(d=>{const c=d.data(),other=(c.members||[]).find(x=>x!==currentUser.uid)||currentUser.uid,name=c.names?.[other]||'Chat';if(term&&!name.toLowerCase().includes(term))return;found++;main.append(row(name,c.lastMessage||'Start a conversation',()=>openChat(d.id,c,name)))});if(!found)main.append(el('div','empty','No chats yet. Open People to start a conversation.'))},e=>main.append(el('div','notice',e.message)))}
else if(tab==='people'){main.append(el('div','sectiontitle','Find people'));try{const snap=await getDocs(query(collection(db,'users'),limit(100)));allUsers=snap.docs.map(d=>d.data()).filter(u=>u.uid!==currentUser.uid);const users=allUsers.filter(u=>!term||(u.name||'').toLowerCase().includes(term)||(u.email||'').toLowerCase().includes(term));if(!users.length)main.append(el('div','empty','No other users found yet. Ask a friend to create an account.'));users.forEach(u=>main.append(row(u.name||u.email||'King Chat user',u.email||'Tap to message',()=>startChat(u),u.photoURL)))}catch(e){main.append(el('div','notice','Could not load people: '+e.message))}}
else if(tab==='updates'){main.append(el('div','sectiontitle','Updates'),el('div','empty','Status updates are planned for a future version.'))}
else if(tab==='settings'){main.append(el('div','sectiontitle','Account settings'));main.append(row(currentUser.displayName||'Your account',currentUser.email||''));main.append(row('Account ID',currentUser.uid));main.append(el('div','notice','King Chat starter version. Voice/video calls, push notifications, media sharing, group administration and end-to-end encryption are not included yet.'))}}
async function startChat(other){try{const q=query(collection(db,'chats'),where('members','array-contains',currentUser.uid));const snap=await getDocs(q);let existing=snap.docs.find(d=>(d.data().members||[]).includes(other.uid));let id,c;if(existing){id=existing.id;c=existing.data()}else{const names={[currentUser.uid]:currentUser.displayName||currentUser.email,[other.uid]:other.name||other.email};const ref=await addDoc(collection(db,'chats'),{members:[currentUser.uid,other.uid],names,lastMessage:'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});id=ref.id;c={members:[currentUser.uid,other.uid],names}}await openChat(id,c,other.name||other.email||'Chat')}catch(e){main.append(el('div','notice',e.message))}}
async function openChat(id,c,name){activeChat={id,c,name};main.replaceChildren();main.append(el('div','sectiontitle','‹ '+name));main.lastChild.style.cursor='pointer';main.lastChild.onclick=()=>renderTab('chats');composer.classList.remove('hidden');if(unsubMessages)unsubMessages();try{const q=query(collection(db,'chats',id,'messages'),orderBy('createdAt','asc'),limit(200));unsubMessages=onSnapshot(q,s=>{main.replaceChildren();const head=el('div','sectiontitle','‹ '+name);head.onclick=()=>renderTab('chats');head.style.cursor='pointer';main.append(head);s.forEach(d=>{const m=d.data();main.append(el('div','bubble'+(m.senderId===currentUser.uid?' mine':''),m.text||''))});main.scrollTop=main.scrollHeight},e=>main.append(el('div','notice',e.message)))}catch(e){main.append(el('div','notice',e.message))}}
document.querySelector('#send').onclick=sendMessage;document.querySelector('#messageInput').onkeydown=e=>{if(e.key==='Enter')sendMessage()};
async function sendMessage(){const input=document.querySelector('#messageInput'),text=input.value.trim();if(!text||!activeChat)return;input.value='';try{await addDoc(collection(db,'chats',activeChat.id,'messages'),{text,senderId:currentUser.uid,createdAt:serverTimestamp()});await setDoc(doc(db,'chats',activeChat.id),{lastMessage:text,updatedAt:serverTimestamp()},{merge:true})}catch(e){input.value=text;main.append(el('div','notice','Message failed: '+e.message))}}
</script>
</body></html>
